[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-server"
version = "0.6.0"
description = "PostgreSQL-backed, RAW-first personal photo library"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
  "pillow>=11,<13",
  "pillow-heif>=0.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
photo-server = "photo_server.cli:main"
photo-upload = "photo_server.upload_client:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL, S3, and ExifTool"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Generated by @hey-api/openapi-python (openapi-python.config.ts); never edit
# by hand. The one formatting miss (I001 import order) is tolerated so the
# committed artifact stays byte-identical to the raw generator output that
# `npm run check:api` diffs against.
"src/photo_server/generated/*" = ["I001"]

[tool.hatch.build.targets.wheel]
packages = ["src/photo_server"]
