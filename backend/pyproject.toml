[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-server"
version = "0.2.0"
description = "Recoverable, RAW-first personal photo library"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
  "pillow>=11,<13",
  "pillow-heif>=0.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
photo-server = "photo_server.cli:main"
photo-upload = "photo_server.upload_client:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL, S3, and ExifTool"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
