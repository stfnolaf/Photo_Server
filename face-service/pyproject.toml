[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "face-service"
version = "0.1.0"
description = "Stateless face detection and AdaFace embedding microservice (YuNet + SFace + AdaFace IR101 on CUDA)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "pillow>=11,<13",
  "numpy>=2.2,<3",
  "cryptography>=46,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
face-service = "face_service.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/face_service"]
