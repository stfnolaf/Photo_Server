name: photo-server
x-backend: &backend
  build: ./backend
  environment:
    PHOTO_S3_ENDPOINT: ${PHOTO_S3_ENDPOINT:?Set PHOTO_S3_ENDPOINT in .env}
    PHOTO_S3_BUCKET: ${PHOTO_S3_BUCKET:-photo-library}
    PHOTO_S3_ANONYMOUS: ${PHOTO_S3_ANONYMOUS:-true}
    POSTGRES_USER: ${POSTGRES_USER:-photo}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:-photo}
    PHOTO_POSTGRES_HOST: postgres
    PHOTO_POSTGRES_PORT: 5432
    PHOTO_DATA_DIR: /data
    PHOTO_MAX_BATCH_FILES: ${PHOTO_MAX_BATCH_FILES:-1000}
    PHOTO_MAX_FILE_BYTES: ${PHOTO_MAX_FILE_BYTES:-536870912}
    PHOTO_UPLOAD_WORKERS: ${PHOTO_UPLOAD_WORKERS:-4}
    PHOTO_UPLOAD_ABANDON_SECONDS: ${PHOTO_UPLOAD_ABANDON_SECONDS:-86400}
    PHOTO_WORKER_THREADS: ${PHOTO_WORKER_THREADS:-4}
    PHOTO_POSTGRES_BACKUP_PREFIX: ${PHOTO_POSTGRES_BACKUP_PREFIX:-backups/postgres}
    PHOTO_UPLOAD_PART_BYTES: ${PHOTO_UPLOAD_PART_BYTES:-8388608}
    PHOTO_CORS_ORIGINS: ${PHOTO_CORS_ORIGINS:-}
    PHOTO_AI_OLLAMA_URL: http://ollama:11434
    PHOTO_AI_MODEL: ${PHOTO_AI_MODEL:-qwen3-vl:8b-instruct-q4_K_M}
    PHOTO_AI_TIMEOUT_SECONDS: ${PHOTO_AI_TIMEOUT_SECONDS:-600}
    PHOTO_AI_CONTEXT_TOKENS: ${PHOTO_AI_CONTEXT_TOKENS:-4096}
    PHOTO_AI_FACE_MAX_IMAGE_SIDE: ${PHOTO_AI_FACE_MAX_IMAGE_SIDE:-2000}
    PHOTO_AI_VLM_MAX_IMAGE_SIDE: ${PHOTO_AI_VLM_MAX_IMAGE_SIDE:-1280}
    PHOTO_FACE_MODELS_DIR: /models
    PHOTO_FACE_DETECTION_THRESHOLD: ${PHOTO_FACE_DETECTION_THRESHOLD:-0.8}
    PHOTO_FACE_MATCH_THRESHOLD: ${PHOTO_FACE_MATCH_THRESHOLD:-0.4}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  volumes:
    - app-data:/data
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-photo}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
  ollama:
    image: ollama/ollama:0.12.7
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
  ollama-model:
    image: ollama/ollama:0.12.7
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${PHOTO_AI_MODEL:-qwen3-vl:8b-instruct-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
  backup:
    build: ./ops/postgres-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-photo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-photo}
      PHOTO_S3_ENDPOINT: ${PHOTO_S3_ENDPOINT:?Set PHOTO_S3_ENDPOINT in .env}
      PHOTO_S3_BUCKET: ${PHOTO_S3_BUCKET:-photo-library}
      PHOTO_S3_ANONYMOUS: ${PHOTO_S3_ANONYMOUS:-true}
      PHOTO_POSTGRES_BACKUP_PREFIX: ${PHOTO_POSTGRES_BACKUP_PREFIX:-backups/postgres}
      PHOTO_POSTGRES_BACKUP_INTERVAL_SECONDS: ${PHOTO_POSTGRES_BACKUP_INTERVAL_SECONDS:-3600}
      PHOTO_POSTGRES_BACKUP_RETENTION: ${PHOTO_POSTGRES_BACKUP_RETENTION:-168}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports:
      - "${PHOTO_API_BIND:-0.0.0.0}:${PHOTO_API_PORT:-8000}:8000"
  worker:
    <<: *backend
    command: ["photo-server", "worker"]
  ai-worker:
    <<: *backend
    build:
      context: ./backend
      dockerfile: Dockerfile.ai
    command: ["photo-server", "ai-worker"]
    volumes:
      - app-data:/data
      - type: bind
        source: ${PHOTO_FACE_MODEL_DIR:-../face-scanner/runtime/raw-jpeg/models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  web:
    build: ./frontend/web
    ports:
      - "${PHOTO_WEB_BIND:-0.0.0.0}:${PHOTO_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_started
volumes:
  postgres-data:
  app-data:
  ollama-data:
