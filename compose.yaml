name: photo-server
x-backend: &backend
  build: ./backend
  environment: &backend-environment
    PHOTO_S3_ENDPOINT: ${PHOTO_S3_ENDPOINT:?Set PHOTO_S3_ENDPOINT in .env}
    PHOTO_S3_BUCKET: ${PHOTO_S3_BUCKET:-photo-library}
    PHOTO_S3_ANONYMOUS: ${PHOTO_S3_ANONYMOUS:-true}
    PHOTO_S3_MULTIPART_EXPIRY_DAYS: ${PHOTO_S3_MULTIPART_EXPIRY_DAYS:-2}
    POSTGRES_USER: ${POSTGRES_USER:-photo}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:-photo}
    PHOTO_POSTGRES_HOST: postgres
    PHOTO_POSTGRES_PORT: 5432
    PHOTO_DATA_DIR: /data
    PHOTO_MAX_BATCH_FILES: ${PHOTO_MAX_BATCH_FILES:-1000}
    PHOTO_MAX_FILE_BYTES: ${PHOTO_MAX_FILE_BYTES:-536870912}
    PHOTO_UPLOAD_WORKERS: ${PHOTO_UPLOAD_WORKERS:-4}
    PHOTO_UPLOAD_ABANDON_SECONDS: ${PHOTO_UPLOAD_ABANDON_SECONDS:-86400}
    PHOTO_UPLOAD_CLEANUP_INTERVAL: ${PHOTO_UPLOAD_CLEANUP_INTERVAL:-60}
    PHOTO_WORKER_THREADS: ${PHOTO_WORKER_THREADS:-4}
    # Display-only burst grouping thresholds. Both perceptual hashes must be
    # within their configured distances for a frame to join a burst.
    PHOTO_BURST_CLUSTER_PHASH_MAX_DISTANCE: ${PHOTO_BURST_CLUSTER_PHASH_MAX_DISTANCE:-17}
    PHOTO_BURST_CLUSTER_DHASH_MAX_DISTANCE: ${PHOTO_BURST_CLUSTER_DHASH_MAX_DISTANCE:-15}
    PHOTO_BURST_CLUSTER_CAPTURE_WINDOW_SECONDS: ${PHOTO_BURST_CLUSTER_CAPTURE_WINDOW_SECONDS:-35}
    # Preview cache LRU limit. Previews are disposable: after eviction a
    # GET /assets/{id}/preview returns 202 and re-encodes from the immutable
    # S3 original, so over budget costs only a re-encode. The worker evicts
    # least-recently-accessed assets when the accounted size passes the
    # budget, down to 90% of it (target ratio) to avoid thrashing.
    PHOTO_CACHE_MAX_BYTES: ${PHOTO_CACHE_MAX_BYTES:-53687091200}
    PHOTO_CACHE_EVICTION_INTERVAL: ${PHOTO_CACHE_EVICTION_INTERVAL:-300}
    PHOTO_CACHE_EVICT_TARGET_RATIO: ${PHOTO_CACHE_EVICT_TARGET_RATIO:-0.9}
    PHOTO_POSTGRES_BACKUP_PREFIX: ${PHOTO_POSTGRES_BACKUP_PREFIX:-backups/postgres}
    PHOTO_UPLOAD_PART_BYTES: ${PHOTO_UPLOAD_PART_BYTES:-8388608}
    PHOTO_CORS_ORIGINS: ${PHOTO_CORS_ORIGINS:-}
    # OpenAI-compatible VLM endpoint; empty disables the AI worker gate.
    # Local Compose uses http://vllm:8000/v1; hosted providers are also
    # supported when PHOTO_AI_API_KEY is set.
    PHOTO_AI_BASE_URL: ${PHOTO_AI_BASE_URL:-http://vllm:8000/v1}
    PHOTO_AI_MODEL: ${PHOTO_AI_MODEL:-unsloth/Qwen3-VL-8B-Instruct-bnb-4bit}
    PHOTO_AI_TIMEOUT_SECONDS: ${PHOTO_AI_TIMEOUT_SECONDS:-600}
    PHOTO_AI_API_KEY: ${PHOTO_AI_API_KEY:-}
    PHOTO_AI_EXTRA_BODY: ${PHOTO_AI_EXTRA_BODY:-}
    PHOTO_AI_FACE_MAX_IMAGE_SIDE: ${PHOTO_AI_FACE_MAX_IMAGE_SIDE:-2000}
    PHOTO_AI_VLM_MAX_IMAGE_SIDE: ${PHOTO_AI_VLM_MAX_IMAGE_SIDE:-1280}
    PHOTO_AI_WORKERS: ${PHOTO_AI_WORKERS:-1}
    # Face inference runs in the standalone face-service (Phase 2B of
    # docs/ai-service-split-plan.md); the worker only talks to it over HTTP
    # (face_client). Local Compose wires the face-service automatically;
    # setting either AI URL empty still disables the AI worker gate.
    PHOTO_FACE_SERVICE_URL: ${PHOTO_FACE_SERVICE_URL:-http://face-service:8901}
    PHOTO_FACE_SERVICE_TOKEN: ${PHOTO_FACE_SERVICE_TOKEN:-}
    PHOTO_FACE_SERVICE_TIMEOUT: ${PHOTO_FACE_SERVICE_TIMEOUT:-120}
    PHOTO_FACE_MATCH_THRESHOLD: ${PHOTO_FACE_MATCH_THRESHOLD:-0.4}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  volumes:
    - app-data:/data
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-photo}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
  vllm:
    image: ${PHOTO_VLLM_IMAGE:-vllm/vllm-openai:v0.11.2}
    restart: unless-stopped
    command:
      - --model
      - ${PHOTO_AI_MODEL:-unsloth/Qwen3-VL-8B-Instruct-bnb-4bit}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - ${PHOTO_AI_MODEL:-unsloth/Qwen3-VL-8B-Instruct-bnb-4bit}
      - --max-model-len
      - ${PHOTO_VLLM_MAX_MODEL_LEN:-4096}
      - --max-num-seqs
      - "${PHOTO_VLLM_MAX_NUM_SEQS:-1}"
      - --gpu-memory-utilization
      - ${PHOTO_VLLM_GPU_MEMORY_UTILIZATION:-0.70}
      - --no-enforce-eager
    volumes:
      - vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 30
  backup:
    build: ./ops/postgres-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-photo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-photo}
      PHOTO_S3_ENDPOINT: ${PHOTO_S3_ENDPOINT:?Set PHOTO_S3_ENDPOINT in .env}
      PHOTO_S3_BUCKET: ${PHOTO_S3_BUCKET:-photo-library}
      PHOTO_S3_ANONYMOUS: ${PHOTO_S3_ANONYMOUS:-true}
      PHOTO_POSTGRES_BACKUP_PREFIX: ${PHOTO_POSTGRES_BACKUP_PREFIX:-backups/postgres}
      PHOTO_POSTGRES_BACKUP_INTERVAL_SECONDS: ${PHOTO_POSTGRES_BACKUP_INTERVAL_SECONDS:-3600}
      PHOTO_POSTGRES_BACKUP_RETENTION: ${PHOTO_POSTGRES_BACKUP_RETENTION:-168}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports:
      - "${PHOTO_API_BIND:-0.0.0.0}:${PHOTO_API_PORT:-8000}:8000"
  worker:
    <<: *backend
    command: ["photo-server", "worker", "--mode", "onboarding"]
    environment:
      <<: *backend-environment
      PHOTO_WORKER_THREADS: ${PHOTO_ONBOARDING_WORKERS:-4}
  processing-worker:
    <<: *backend
    command: ["photo-server", "worker", "--mode", "processing"]
    environment:
      <<: *backend-environment
      PHOTO_WORKER_THREADS: ${PHOTO_PROCESSING_WORKERS:-2}
  preview-worker:
    <<: *backend
    command: ["photo-server", "worker", "--mode", "preview"]
    environment:
      <<: *backend-environment
      PHOTO_WORKER_THREADS: ${PHOTO_PREVIEW_WORKERS:-2}
  face-service:
    # The GPU service of the stack (Phase 2B): the only place a face model
    # runs. Stateless — results flow back over HTTP and land in Postgres/S3
    # via the worker. Plain HTTP on the docker network; set
    # PHOTO_FACE_SERVICE_TOKEN for the bearer token (both sides share it).
    build: ./face-service
    restart: unless-stopped
    environment:
      PHOTO_FACE_SERVICE_BIND: 0.0.0.0:8901
      PHOTO_FACE_SERVICE_TOKEN: ${PHOTO_FACE_SERVICE_TOKEN:-}
      PHOTO_FACE_MODELS_DIR: /models
      PHOTO_FACE_DETECTION_THRESHOLD: ${PHOTO_FACE_DETECTION_THRESHOLD:-0.8}
      PHOTO_FACE_SERVICE_CONCURRENCY: ${PHOTO_FACE_SERVICE_CONCURRENCY:-1}
    volumes:
      - type: bind
        source: ${PHOTO_FACE_MODEL_DIR:-../face-scanner/runtime/raw-jpeg/models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  ai-worker:
    # Base image (Phase 2B): the worker no longer carries the CUDA stack or
    # any face model; it is a plain HTTP client for the two AI services.
    <<: *backend
    command: ["photo-server", "ai-worker"]
  web:
    build: ./frontend/web
    ports:
      - "${PHOTO_WEB_BIND:-0.0.0.0}:${PHOTO_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_started
volumes:
  postgres-data:
  app-data:
  vllm-cache:
